schema: strucgu/expected@1
# What a correct checker produces on each tree here, as data. expected.md says
# the same thing in prose and is the statement of intent — why each tree exists
# and what boundary it pins. The two must agree; where they disagree that is a
# defect to report, not a precedence order to apply.
#
# Values are the five states in SPEC.md "Audit output" and nothing else.
# Judgment entries are keyed by their own ids rather than per tree: one line is
# emitted per entry on every tree, whether or not anyone is available to judge
# it, so the value does not vary by tree.
#
# Only this module's checks and judgment entries appear. Every tree also adopts
# findings-queue, because TR-03 needs a findings role to point at; its FQ-*
# results are that module's fixtures.

checks:
  satisfies:
    TR-01: ok
    TR-02: ok
    TR-03: ok
    TR-04: ok
    TR-05: ok

  violates-TR-01:
    TR-01: finding
    TR-02: skip
    TR-03: skip
    TR-04: skip
    TR-05: skip

  violates-TR-02:
    TR-01: ok
    TR-02: finding
    TR-03: ok
    TR-04: ok
    TR-05: ok

  violates-TR-03:
    TR-01: ok
    TR-02: ok
    TR-03: finding
    TR-04: ok
    TR-05: ok

  violates-TR-04:
    TR-01: ok
    TR-02: ok
    TR-03: ok
    TR-04: finding
    TR-05: ok

  violates-TR-05:
    TR-01: ok
    TR-02: ok
    TR-03: ok
    TR-04: ok
    TR-05: finding

  # The one tree in the catalog where a check reports `waived`. TR-02 fails on
  # the same triage.md that violates-TR-02/ carries; here the adoption record
  # accepts the deviation, so a checker echoes the reason and reports `waived`.
  # Folding it into `ok` hides an accepted deviation from every run; folding it
  # into `finding` ignores the record. Its review_by is 2099-12-31, which is
  # what makes this row true rather than dated — see expected.md.
  waives-TR-02:
    TR-01: ok
    TR-02: waived
    TR-03: ok
    TR-04: ok
    TR-05: ok

  # The same deviation with its review_by passed. Detection reasserts itself
  # and nobody enforced anything: the check reports a finding again.
  violates-TR-02-expired-deviation:
    TR-01: ok
    TR-02: finding
    TR-03: ok
    TR-04: ok
    TR-05: ok

  # A tree in the third shape: every check passes, and it is not `satisfies/`
  # because the content it needs contradicts that tree's. The rule sentence
  # names the destination in prose only — "write one row in the findings queue"
  # — and the resolving link is in a table further down. TR-03 is ok. A checker
  # that read triage-destination as being about the sentence rather than about
  # the document reports a finding here.
  satisfies-prose-destination:
    TR-01: ok
    TR-02: ok
    TR-03: ok
    TR-04: ok
    TR-05: ok

judgment:
  triage.boundary-is-a-claim: judgment
  triage.destination-is-real: judgment
