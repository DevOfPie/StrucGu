# StrucGu's own adoption record — the catalog applied to itself.
#
# This is dogfooding, not evidence. An author unconsciously writes rules they
# already satisfy, so a clean run here proves very little; the fixtures under
# modules/*/fixtures/ are what shows the checks detect anything. See
# docs/records/decisions.md, "Self-application is dogfooding, not evidence".
#
# Hand-edited. No tool writes this file.

schema: strucgu/adoption@1

modules:
  triage-rule:
    version: "0.1.0"
    adopted: 2026-07-31
    roles:
      triage_doc: docs/records/triage.md

  decision-log:
    version: "0.1.0"
    adopted: 2026-07-31
    form: single-log
    # The repository's first commit. DL-03 must not read history before this,
    # and there is none.
    effective_from: 2026-07-31
    roles:
      decision_log: docs/records/decisions.md
      # Same file. Under single-log the index is a section, which is why DL-05
      # passes here whenever DL-01 does — a documented weakness of that check,
      # covered by the judgment entry decision-log.index-exists-in-substance.
      decision_index: docs/records/decisions.md

  findings-queue:
    version: "0.1.0"
    adopted: 2026-07-31
    roles:
      # Deliberately not under a directory a static site generator would sweep
      # up. This repository publishes nothing today, and the queue is where a
      # future decision to publish would leak first.
      findings: docs/records/findings.md

  work-units:
    version: "0.1.0"
    adopted: 2026-07-31
    roles:
      unit_dir: docs/records/work/
      unit_template: docs/records/work/_template.md
      unit_index: docs/records/work/README.md

  investigations:
    version: "0.1.0"
    adopted: 2026-07-31
    roles:
      # Mapped in M10. It was deliberately unmapped from 0.1.0 until then — no
      # investigation had outgrown a decision entry, so the obligation's
      # condition was unmet and every IN-* check reported skip. The first
      # checker's ambiguity log is the investigation that outgrew one, and the
      # four IN-* checks stop skipping because a real record now exists rather
      # than because one was invented to exercise them. What that costs the
      # self-walk — the skip path is now exercised nowhere in this repository —
      # is M13's to record.
      investigations: docs/records/investigations/

# No exclusions. Every path this repository owns is intended to be read, and the
# fixture trees under modules/*/fixtures/ are not inside any mapped role, so
# their deliberately broken links are never scanned by a check.

# No deviations. Every check adopted above passes, and writing a false one to
# exercise the mechanism would put an untrue claim in the one file whose whole
# purpose is to be a truthful claim. See docs/records/decisions.md, "This
# repository records no deviation of its own".
